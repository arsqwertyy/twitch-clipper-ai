<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b44f7"/>
      <stop offset="100%" stop-color="#6c2bd9"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e84118"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="440" rx="18" fill="url(#bgGrad)" stroke="#2a2a3c" stroke-width="2"/>

  <!-- Header -->
  <text x="36" y="44" fill="#f5f6fa" font-family="Segoe UI, Ubuntu, sans-serif" font-size="20" font-weight="bold">
    TWITCH CLIPPER AI — END-TO-END AUTONOMOUS PIPELINE &amp; 9:16 LAYOUT
  </text>
  <text x="36" y="68" fill="#9c9cab" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13">
    Multi-Channel Streamlink Ring Buffer • 7TV/BTTV Emote Wave Engine • Faster-Whisper CUDA • YuNet ONNX • YouTube Data API v3
  </text>

  <!-- Stage 1: Ingestion & Detection -->
  <rect x="36" y="96" width="235" height="145" rx="12" fill="#181824" stroke="#8b44f7" stroke-width="1.8"/>
  <rect x="36" y="96" width="235" height="32" rx="12" fill="url(#purpleGrad)"/>
  <text x="153" y="117" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. LIVE INGESTION &amp; CHAT AI</text>
  <text x="52" y="148" fill="#00f2fe" font-family="Consolas, monospace" font-size="12">• Twitch GQL + IRC SSL</text>
  <text x="52" y="170" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• 8,300+ 7TV &amp; BTTV Emotes</text>
  <text x="52" y="192" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• Robust MAD Z-Score Engine</text>
  <text x="52" y="214" fill="#00e676" font-family="Segoe UI, sans-serif" font-size="12">• Voice Peak Tracker (250-3600Hz)</text>

  <!-- Arrow 1->2 -->
  <line x1="271" y1="168" x2="305" y2="168" stroke="#00f2fe" stroke-width="2.5"/>
  <polygon points="305,162 317,168 305,174" fill="#00f2fe"/>

  <!-- Stage 2: Neural Vision & Speech -->
  <rect x="319" y="96" width="245" height="145" rx="12" fill="#181824" stroke="#00b894" stroke-width="1.8"/>
  <rect x="319" y="96" width="245" height="32" rx="12" fill="url(#tealGrad)"/>
  <text x="441" y="117" fill="#0b0b10" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. WHISPER CUDA &amp; YUNET</text>
  <text x="335" y="148" fill="#fbc531" font-family="Consolas, monospace" font-size="12">• Faster-Whisper large-v3-turbo</text>
  <text x="335" y="170" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• YuNet ONNX Face &amp; Box Crop</text>
  <text x="335" y="192" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• Smart Hook Phrase Boundary</text>
  <text x="335" y="214" fill="#00f2fe" font-family="Segoe UI, sans-serif" font-size="12">• Cliffhanger Pause Placement</text>

  <!-- Arrow 2->3 -->
  <line x1="564" y1="168" x2="598" y2="168" stroke="#00f2fe" stroke-width="2.5"/>
  <polygon points="598,162 610,168 598,174" fill="#00f2fe"/>

  <!-- Stage 3: Tournament & YouTube API -->
  <rect x="612" y="96" width="235" height="145" rx="12" fill="#181824" stroke="#ff5252" stroke-width="1.8"/>
  <rect x="612" y="96" width="235" height="32" rx="12" fill="url(#redGrad)"/>
  <text x="729" y="117" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. KING OF THE HOUR &amp; YT</text>
  <text x="628" y="148" fill="#ffd32a" font-family="Consolas, monospace" font-size="12">• Candidate Pool Ranking</text>
  <text x="628" y="170" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• Whisper Story Quality Score</text>
  <text x="628" y="192" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12">• YouTube Data API v3 Upload</text>
  <text x="628" y="214" fill="#00e676" font-family="Segoe UI, sans-serif" font-size="12">• Auto First Creator Comment</text>

  <!-- Bottom Box: NVENC Render Specs -->
  <rect x="36" y="264" width="811" height="142" rx="12" fill="#14141d" stroke="#2a2a3c" stroke-width="1.5"/>
  <text x="56" y="294" fill="#00f2fe" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">
    ⚡ NVIDIA RTX HARDWARE PIPELINE &amp; TOURNAMENT SELECTION ENGINE
  </text>
  <text x="56" y="322" fill="#d2d2e0" font-family="Consolas, monospace" font-size="12">
    HypeRank = ViralScore×1.0 + Z_Score×8.0 + ln(1 + PeakScore)×12.0 + WhisperSpeechScore(-45..+26)
  </text>
  <text x="56" y="350" fill="#9c9cab" font-family="Segoe UI, sans-serif" font-size="12">
    • Minimum Clip Guard: ≥ 20s duration &amp; ≥ 6 spoken words (eliminates silent / empty cutscenes &amp; chat poll bait)
  </text>
  <text x="56" y="374" fill="#9c9cab" font-family="Segoe UI, sans-serif" font-size="12">
    • First-Batch Fast Start: 12-minute initial selection pool on startup, followed by 60-minute King-of-the-Hour cycles
  </text>
  <text x="56" y="396" fill="#00e676" font-family="Segoe UI, sans-serif" font-size="12">
    • Auto Disk Hygiene: 150s rolling .ts buffer + automatic post-upload candidate cleanup
  </text>

  <!-- Right Panel: 9:16 Vertical Layout Mockup -->
  <rect x="880" y="36" width="184" height="370" rx="18" fill="#09090d" stroke="#8b44f7" stroke-width="2.5"/>
  <!-- Top Webcam Split (1080x624) -->
  <rect x="888" y="44" width="168" height="112" rx="10" fill="#1d1b38" stroke="#00e676" stroke-width="1.5"/>
  <text x="972" y="88" fill="#00e676" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">STREAMER WEBCAM</text>
  <text x="972" y="108" fill="#9c9cab" font-family="Consolas, monospace" font-size="10" text-anchor="middle">1080×624 (YuNet AI)</text>
  <text x="972" y="126" fill="#00f2fe" font-family="Consolas, monospace" font-size="10" text-anchor="middle">+18% Climax Zoom</text>

  <!-- Divider -->
  <rect x="888" y="158" width="168" height="4" fill="#8b44f7"/>

  <!-- Bottom Gameplay Split (1080x1290) -->
  <rect x="888" y="164" width="168" height="234" rx="10" fill="#141829"/>
  <text x="972" y="264" fill="#f5f6fa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GAMEPLAY / STREAM</text>
  <text x="972" y="282" fill="#9c9cab" font-family="Consolas, monospace" font-size="10" text-anchor="middle">1080×1290 (Smart Pan)</text>

  <!-- Banner Overlay -->
  <rect x="900" y="182" width="144" height="44" rx="8" fill="#2c1654" stroke="#fbc531" stroke-width="1.5"/>
  <text x="972" y="202" fill="#fbc531" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📢 SMART CLIFFHANGER</text>
  <text x="972" y="217" fill="#ffffff" font-family="Consolas, monospace" font-size="9" text-anchor="middle">Voiced Banner Pause</text>

  <!-- Karaoke Subtitles -->
  <rect x="898" y="324" width="148" height="38" rx="8" fill="#000000" fill-opacity="0.72" stroke="#ffd32a" stroke-width="1.2"/>
  <text x="972" y="341" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WHAT <tspan fill="#ffd32a">HAPPENED?!</tspan></text>
  <text x="972" y="355" fill="#9c9cab" font-family="Consolas, monospace" font-size="9" text-anchor="middle">Faster-Whisper ASS</text>
</svg>
